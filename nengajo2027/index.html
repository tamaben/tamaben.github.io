<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAPPY NEW YEAR 2027 | 2027年賀状特別サイト</title>
  <meta name="description" content="2027年賀状特別サイト。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FCF6E8;
      --bg-card: #FFFDF7;
      --bg-warm: #F6ECD4;
      --red-main: #AF2D34;
      --red-dark: #8F2228;
      --gold-main: #D2A650;
      --brown-text: #3D2214;
      --brown-muted: #725544;
      --shadow-soft: 0 12px 32px rgba(61, 34, 20, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-cream);
      color: var(--brown-text);
      font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      position: relative;
      overflow-x: hidden;
    }

    .corner-peek {
      position: fixed;
      bottom: -14px;
      width: 88px;
      height: 88px;
      pointer-events: none;
      z-index: 1;
    }
    .corner-peek-left { left: -14px; }
    .corner-peek-right { right: -14px; }

    .container {
      width: 100%;
      max-width: 640px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .badge {
      display: inline-block;
      background-color: var(--red-main);
      color: #FFFDF7;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 6px 18px;
      border-radius: 999px;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(175, 45, 52, 0.22);
    }

    .title {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(1.9rem, 6.8vw, 3.1rem);
      color: var(--red-main);
      line-height: 1.1;
      margin-bottom: 18px;
      letter-spacing: 0.03em;
    }

    .card-frame {
      background: var(--bg-card);
      border: 3px solid rgba(210, 166, 80, 0.45);
      border-radius: 20px;
      padding: 24px 18px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 20px;
    }

    /* 認証画面 */
    .auth-alert {
      background: rgba(175, 45, 52, 0.08);
      border: 1.5px solid rgba(175, 45, 52, 0.35);
      color: var(--red-main);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .auth-desc {
      font-size: 0.95rem;
      color: var(--brown-text);
      margin-bottom: 16px;
      line-height: 1.7;
    }

    .camera-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #2D1C14;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--gold-main);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .camera-stage video,
    .camera-stage canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .camera-guide {
      position: absolute;
      inset: 10%;
      border: 2.5px dashed rgba(252, 246, 232, 0.85);
      border-radius: 12px;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
    }

    .camera-guide span {
      background: rgba(45, 28, 20, 0.72);
      color: #FCF6E8;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .camera-placeholder {
      color: #FCF6E8;
      padding: 20px;
      font-size: 0.92rem;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      font-weight: 900;
      font-size: 1rem;
      padding: 14px 28px;
      border-radius: 999px;
      transition: transform 0.18s ease, background-color 0.18s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary {
      background-color: var(--red-main);
      color: #FFFDF7;
      box-shadow: 0 8px 20px rgba(175, 45, 52, 0.25);
    }
    .btn-primary:hover:not(:disabled) { background-color: var(--red-dark); }

    .btn-secondary {
      background-color: var(--gold-main);
      color: #FFFDF7;
    }

    .status-msg {
      margin-top: 14px;
      font-size: 0.92rem;
      font-weight: 700;
      min-height: 1.5em;
    }
    .status-ok { color: #2E7D32; }
    .status-err { color: var(--red-main); }

    /* スキャン画面（通常表示 / 認証後） */
    .scan-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .hidden { display: none !important; }

    .footer {
      margin-top: 24px;
      font-size: 0.82rem;
      color: var(--brown-muted);
    }

    @media (max-width: 520px) {
      .corner-peek { width: 64px; height: 64px; bottom: -10px; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="corner-peek corner-peek-left" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <g transform="rotate(28 50 60)">
        <ellipse cx="22" cy="52" rx="12" ry="7" fill="#EFE0A8" />
        <ellipse cx="78" cy="52" rx="12" ry="7" fill="#EFE0A8" />
        <circle cx="50" cy="56" r="34" fill="#EFE0A8" />
        <ellipse cx="42" cy="48" rx="4.5" ry="6.5" fill="#2D1C14" />
        <ellipse cx="58" cy="48" rx="4.5" ry="6.5" fill="#2D1C14" />
        <circle cx="40.5" cy="46" r="1.5" fill="#FFFFFF" />
        <circle cx="56.5" cy="46" r="1.5" fill="#FFFFFF" />
        <path d="M 44 60 Q 50 66 56 60" stroke="#2D1C14" stroke-width="3" fill="none" stroke-linecap="round" />
      </g>
    </svg>
  </div>
  <div class="corner-peek corner-peek-right" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <g transform="rotate(-24 50 60)">
        <ellipse cx="22" cy="52" rx="12" ry="7" fill="#EFE0A8" />
        <ellipse cx="78" cy="52" rx="12" ry="7" fill="#EFE0A8" />
        <circle cx="50" cy="56" r="34" fill="#EFE0A8" />
        <ellipse cx="42" cy="48" rx="4.5" ry="6.5" fill="#2D1C14" />
        <ellipse cx="58" cy="48" rx="4.5" ry="6.5" fill="#2D1C14" />
        <circle cx="40.5" cy="46" r="1.5" fill="#FFFFFF" />
        <circle cx="56.5" cy="46" r="1.5" fill="#FFFFFF" />
        <path d="M 44 60 Q 50 66 56 60" stroke="#2D1C14" stroke-width="3" fill="none" stroke-linecap="round" />
      </g>
    </svg>
  </div>

  <main class="container">
    <div class="badge">2027年賀状特別サイト</div>
    <h1 class="title">HAPPY NEW YEAR 2027</h1>

    <!-- 移動中画面（スマホの人間アクセス時） -->
    <section id="redirect-panel" class="card-frame hidden">
      <p class="auth-desc">特別映像ページ（YouTube）へ移動しています…</p>
      <a id="direct-video-link" class="btn btn-primary" href="https://www.youtube.com/@tamaben-tama">
        🎬 特別映像を視聴する
      </a>
    </section>

    <!-- AI・コンピューター判定時のカメラ認証画面 -->
    <section id="camera-auth-panel" class="card-frame hidden" aria-label="年賀状カメラ認証">
      <div id="detect-reason" class="auth-alert">
        🤖 AIまたはコンピューターからのアクセスを検出しました
      </div>
      <p class="auth-desc">
        参加確認のため、<strong>カメラで実物の年賀状を撮影して認証</strong>してください。
      </p>

      <div class="camera-stage">
        <video id="camera-video" autoplay playsinline muted class="hidden"></video>
        <canvas id="camera-canvas" class="hidden"></canvas>
        <div id="camera-guide" class="camera-guide hidden">
          <span>枠内に年賀状を合わせて撮影してください</span>
        </div>
        <div id="camera-placeholder" class="camera-placeholder">
          「カメラを起動する」を押して年賀状を映してください
        </div>
      </div>

      <div class="btn-row">
        <button id="start-camera-btn" class="btn btn-secondary" type="button">📷 カメラを起動する</button>
        <button id="capture-verify-btn" class="btn btn-primary hidden" type="button">✨ 撮影して認証する</button>
        <button id="retry-camera-btn" class="btn btn-secondary hidden" type="button">🔄 撮り直す</button>
      </div>

      <p id="auth-status" class="status-msg" aria-live="polite"></p>
    </section>

    <!-- 認証完了後の遷移・視聴リンクパネル -->
    <section id="verified-panel" class="card-frame hidden">
      <p class="auth-desc status-ok">✅ 年賀状の確認が完了しました！</p>
      <a id="verified-video-link" class="btn btn-primary" href="https://www.youtube.com/@tamaben-tama">
        🎬 特別映像を視聴する（YouTube）
      </a>
    </section>

    <footer class="footer">
      © 2027年賀状特別サイト
    </footer>
  </main>

  <script>
    const SITE_CONFIG = {
      // 特別映像 / チャンネルの遷移先URL
      targetUrl: "https://www.youtube.com/@tamaben-tama"
    };

    /**
     * AI・自動操作ツール・コンピューター(PC)からのアクセスかを判別
     * @returns {{ isAiOrComputer: boolean, reason: string }}
     */
    function detectAiOrComputer() {
      const ua = navigator.userAgent || "";

      // 1. WebDriver / 自動操作 / ヘッドレス / Bot 判定
      const botPattern = /HeadlessChrome|PhantomJS|Playwright|Puppeteer|Selenium|bot|crawler|spider|curl|wget|python/i;
      if (navigator.webdriver === true || botPattern.test(ua)) {
        return {
          isAiOrComputer: true,
          reason: "🤖 AI・自動操作ブラウザからのアクセスを検出しました"
        };
      }

      // 2. コンピューター（PC / 非モバイル）判定
      const isMobileUa = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
      const hasTouch = (navigator.maxTouchPoints || 0) > 0;
      const isFinePointer = window.matchMedia && window.matchMedia("(pointer: fine)").matches;

      if (!isMobileUa || (!hasTouch && isFinePointer)) {
        return {
          isAiOrComputer: true,
          reason: "💻 コンピューター（PC）からのアクセスを検出しました"
        };
      }

      return { isAiOrComputer: false, reason: "" };
    }

    document.addEventListener("DOMContentLoaded", () => {
      const redirectPanel = document.getElementById("redirect-panel");
      const authPanel = document.getElementById("camera-auth-panel");
      const verifiedPanel = document.getElementById("verified-panel");
      const directLink = document.getElementById("direct-video-link");
      const verifiedLink = document.getElementById("verified-video-link");

      directLink.href = SITE_CONFIG.targetUrl;
      verifiedLink.href = SITE_CONFIG.targetUrl;

      const check = detectAiOrComputer();

      if (!check.isAiOrComputer) {
        // 通常の人間のスマホアクセス → 即座にYouTubeへ移動
        redirectPanel.classList.remove("hidden");
        window.location.replace(SITE_CONFIG.targetUrl);
        return;
      }

      // AIまたはコンピューターと判別 → カメラ撮影認証を要求
      document.getElementById("detect-reason").textContent = check.reason;
      authPanel.classList.remove("hidden");
      initCameraAuth(authPanel, verifiedPanel);
    });

    function initCameraAuth(authPanel, verifiedPanel) {
      const video = document.getElementById("camera-video");
      const canvas = document.getElementById("camera-canvas");
      const guide = document.getElementById("camera-guide");
      const placeholder = document.getElementById("camera-placeholder");
      const startBtn = document.getElementById("start-camera-btn");
      const captureBtn = document.getElementById("capture-verify-btn");
      const retryBtn = document.getElementById("retry-camera-btn");
      const statusEl = document.getElementById("auth-status");

      let stream = null;

      async function startCamera() {
        statusEl.textContent = "";
        statusEl.className = "status-msg";

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          statusEl.textContent = "この環境ではカメラが利用できません。カメラ付き端末でアクセスしてください。";
          statusEl.className = "status-msg status-err";
          return;
        }

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          video.srcObject = stream;
          video.classList.remove("hidden");
          canvas.classList.add("hidden");
          guide.classList.remove("hidden");
          placeholder.classList.add("hidden");
          startBtn.classList.add("hidden");
          retryBtn.classList.add("hidden");
          captureBtn.classList.remove("hidden");
        } catch (err) {
          statusEl.textContent = "カメラの起動が許可されませんでした。カメラへのアクセスを許可してください。";
          statusEl.className = "status-msg status-err";
        }
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
      }

      /**
       * 撮影画像を解析して、真っ暗/単色/ダミー映像でないか＆年賀状らしい情報量があるかを確認
       */
      function verifyCapturedFrame(ctx, w, h) {
        const data = ctx.getImageData(0, 0, w, h).data;
        const step = 16;
        let count = 0;
        let sumLuma = 0;
        let sumSqLuma = 0;
        let warmOrPaperPixels = 0;

        for (let i = 0; i < data.length; i += 4 * step) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const luma = 0.299 * r + 0.587 * g + 0.114 * b;

          sumLuma += luma;
          sumSqLuma += luma * luma;
          count++;

          // 明るい紙面・クリーム色・赤・ゴールド系のピクセルをカウント
          if (luma > 135 && r >= b - 10) {
            warmOrPaperPixels++;
          }
        }

        const mean = sumLuma / count;
        const variance = (sumSqLuma / count) - (mean * mean);
        const stdDev = Math.sqrt(Math.max(0, variance));
        const paperRatio = warmOrPaperPixels / count;

        // 1. 真っ暗 / 白飛び / 単色ダミー画像（分散が小さすぎる）を弾く
        if (mean < 25 || stdDev < 14) {
          return { ok: false, message: "画像が暗すぎるか、年賀状がはっきり映っていません。明るい場所で撮り直してください。" };
        }

        // 2. 年賀状らしい明るい紙面がある程度映っているか
        if (paperRatio < 0.15) {
          return { ok: false, message: "年賀状が枠内にしっかり映るように近づけて撮影してください。" };
        }

        return { ok: true, message: "認証成功！YouTubeへ移動します…" };
      }

      startBtn.addEventListener("click", startCamera);
      retryBtn.addEventListener("click", startCamera);

      captureBtn.addEventListener("click", () => {
        if (!video.videoWidth) return;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        video.classList.add("hidden");
        guide.classList.add("hidden");
        canvas.classList.remove("hidden");
        captureBtn.classList.add("hidden");
        stopCamera();

        const result = verifyCapturedFrame(ctx, canvas.width, canvas.height);
        if (result.ok) {
          statusEl.textContent = result.message;
          statusEl.className = "status-msg status-ok";
          setTimeout(() => {
            authPanel.classList.add("hidden");
            verifiedPanel.classList.remove("hidden");
            window.location.href = SITE_CONFIG.targetUrl;
          }, 900);
        } else {
          statusEl.textContent = result.message;
          statusEl.className = "status-msg status-err";
          retryBtn.classList.remove("hidden");
        }
      });
    }
  </script>
</body>
</html>
