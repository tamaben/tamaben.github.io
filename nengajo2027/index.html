<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAPPY NEW YEAR 2027 | 2027年賀状特別サイト</title>
  <meta name="description" content="2027年賀状特別サイト。YouTubeチャンネルへ移動します。">
  <meta http-equiv="refresh" content="0; url=https://www.youtube.com/@tamaben-tama">
  <script>
    window.location.replace("https://www.youtube.com/@tamaben-tama");
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FCF6E8;
      --bg-card: #FFFDF7;
      --red-main: #AF2D34;
      --red-dark: #8F2228;
      --gold-main: #D2A650;
      --brown-text: #3D2214;
      --brown-muted: #725544;
      --shadow-soft: 0 12px 32px rgba(61, 34, 20, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--brown-text);
      font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* 四隅のひょっこりキャラ（年賀状デザインオマージュ） */
    .corner-peek {
      position: fixed;
      bottom: -14px;
      width: 88px;
      height: 88px;
      pointer-events: none;
      z-index: 1;
    }
    .corner-peek-left { left: -14px; }
    .corner-peek-right { right: -14px; }

    .container {
      width: 100%;
      max-width: 680px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .badge {
      display: inline-block;
      background-color: var(--red-main);
      color: #FFFDF7;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 6px 18px;
      border-radius: 999px;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(175, 45, 52, 0.22);
    }

    .title {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 7vw, 3.3rem);
      color: var(--red-main);
      line-height: 1.1;
      margin-bottom: 20px;
      letter-spacing: 0.03em;
    }

    /* 年賀状スキャン表示カード */
    .card-frame {
      background: var(--bg-card);
      border: 3px solid rgba(210, 166, 80, 0.45);
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 26px;
    }

    .scan-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    /* スキャン画像未配置時の年賀状デザインプレビュー */
    .nengajo-preview {
      background-color: var(--bg-cream);
      border-radius: 12px;
      padding: 24px 16px;
      border: 1px dashed rgba(210, 166, 80, 0.6);
    }

    .preview-hny {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(1.7rem, 6vw, 3rem);
      color: var(--red-main);
      margin-bottom: -10px;
      position: relative;
      z-index: 2;
    }

    .preview-svg {
      width: 100%;
      max-width: 520px;
      height: auto;
      display: block;
      margin: 0 auto 8px;
    }

    .year-digit {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 250px;
      fill: var(--gold-main);
    }

    .preview-note {
      font-size: 0.82rem;
      color: var(--brown-muted);
      margin-top: 6px;
    }

    /* 特別映像リンクボタン */
    .video-link-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .btn-video {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--red-main);
      color: #FFFDF7;
      text-decoration: none;
      font-weight: 900;
      font-size: clamp(1.05rem, 3.5vw, 1.25rem);
      padding: 16px 36px;
      border-radius: 999px;
      box-shadow: 0 8px 22px rgba(175, 45, 52, 0.28);
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-video:hover {
      background-color: var(--red-dark);
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(175, 45, 52, 0.34);
    }

    .btn-video:active {
      transform: scale(0.97);
    }

    .video-hint {
      font-size: 0.85rem;
      color: var(--brown-muted);
    }

    .footer {
      margin-top: 32px;
      font-size: 0.82rem;
      color: var(--brown-muted);
    }

    @media (max-width: 520px) {
      .corner-peek { width: 64px; height: 64px; bottom: -10px; }
      .card-frame { padding: 10px; }
      .btn-video { width: 100%; padding: 15px 20px; }
    }
  </style>
</head>
<body>
  <!-- 四隅キャラクター -->
  <div class="corner-peek corner-peek-left" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <g transform="rotate(28 50 60)">
        <ellipse cx="22" cy="52" rx="12" ry="7" fill="#EFE0A8" />
        <ellipse cx="78" cy="52" rx="12" ry="7" fill="#EFE0A8" />
        <circle cx="50" cy="56" r="34" fill="#EFE0A8" />
        <ellipse cx="42" cy="48" rx="4.5" ry="6.5" fill="#2D1C14" />
        <ellipse cx="58" cy="48" rx="4.5" ry="6.5" fill="#2D1C14" />
        <circle cx="40.5" cy="46" r="1.5" fill="#FFFFFF" />
        <circle cx="56.5" cy="46" r="1.5" fill="#FFFFFF" />
        <path d="M 44 60 Q 50 66 56 60" stroke="#2D1C14" stroke-width="3" fill="none" stroke-linecap="round" />
      </g>
    </svg>
  </div>
  <div class="corner-peek corner-peek-right" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <g transform="rotate(-24 50 60)">
        <ellipse cx="22" cy="52" rx="12" ry="7" fill="#EFE0A8" />
        <ellipse cx="78" cy="52" rx="12" ry="7" fill="#EFE0A8" />
        <circle cx="50" cy="56" r="34" fill="#EFE0A8" />
        <ellipse cx="42" cy="48" rx="4.5" ry="6.5" fill="#2D1C14" />
        <ellipse cx="58" cy="48" rx="4.5" ry="6.5" fill="#2D1C14" />
        <circle cx="40.5" cy="46" r="1.5" fill="#FFFFFF" />
        <circle cx="56.5" cy="46" r="1.5" fill="#FFFFFF" />
        <path d="M 44 60 Q 50 66 56 60" stroke="#2D1C14" stroke-width="3" fill="none" stroke-linecap="round" />
      </g>
    </svg>
  </div>

  <main class="container">
    <div class="badge">2027年賀状特別サイト</div>
    <h1 class="title">HAPPY NEW YEAR 2027</h1>

    <!-- 年賀状のスキャン画面 -->
    <section class="card-frame" aria-label="2027年賀状スキャン">
      <div id="nengajo-display"></div>
    </section>

    <!-- 特別映像を視聴するためのリンク -->
    <section class="video-link-box" aria-label="特別映像リンク">
      <a id="special-video-link" class="btn-video" href="#" target="_blank" rel="noopener noreferrer">
        🎬 特別映像を視聴する
      </a>
      <p id="video-link-note" class="video-hint"></p>
    </section>

    <footer class="footer">
      © 2027年賀状特別サイト
    </footer>
  </main>

  <script>
    /**
     * =========================================================
     * 設定：ここの2項目を差し替えるだけで完成します
     * =========================================================
     */
    const SITE_CONFIG = {
      // 1. 年賀状スキャン画像のファイル名（同じフォルダに置く場合）
      // 例: "nengajo2027.jpg"
      nengajoScanImage: "nengajo2027.jpg",

      // 2. 特別映像の視聴リンク URL（YouTube や Google Drive などのURL）
      videoUrl: "https://www.youtube.com/@tamaben-tama"
    };

    document.addEventListener("DOMContentLoaded", () => {
      // 年賀状スキャン画像の表示
      const displayEl = document.getElementById("nengajo-display");
      if (SITE_CONFIG.nengajoScanImage) {
        const img = document.createElement("img");
        img.src = SITE_CONFIG.nengajoScanImage;
        img.alt = "2027年賀状";
        img.className = "scan-image";
        img.onerror = () => renderFallbackCard(displayEl);
        displayEl.appendChild(img);
      } else {
        renderFallbackCard(displayEl);
      }

      // 特別映像リンクの設定
      const linkEl = document.getElementById("special-video-link");
      const noteEl = document.getElementById("video-link-note");
      if (SITE_CONFIG.videoUrl) {
        linkEl.href = SITE_CONFIG.videoUrl;
        noteEl.textContent = "自動で移動しない場合は上のボタンをタップしてください";
      } else {
        linkEl.addEventListener("click", (e) => {
          e.preventDefault();
          alert("特別映像のURLがまだ設定されていません。SITE_CONFIG.videoUrl に動画リンクを設定してください。");
        });
        noteEl.textContent = "※ 準備中（SITE_CONFIG.videoUrl に視聴リンクを設定してください）";
      }
    });

    function renderFallbackCard(container) {
      container.innerHTML = `
        <div class="nengajo-preview">
          <div class="preview-hny">HAPPY NEW YEAR</div>
          <svg viewBox="0 0 800 300" class="preview-svg" aria-hidden="true">
            <text x="115" y="245" class="year-digit" text-anchor="middle">2</text>
            <text x="305" y="245" class="year-digit" text-anchor="middle">0</text>
            <text x="495" y="245" class="year-digit" text-anchor="middle">2</text>
            <text x="680" y="245" class="year-digit" text-anchor="middle">7</text>

            <g transform="translate(132, 195)">
              <circle cx="0" cy="0" r="24" fill="#EFE0A8" />
              <ellipse cx="-6" cy="-4" rx="3" ry="4.5" fill="#2D1C14" />
              <ellipse cx="6" cy="-4" rx="3" ry="4.5" fill="#2D1C14" />
              <path d="M -4 4 Q 0 8 4 4" stroke="#2D1C14" stroke-width="2.2" fill="none" stroke-linecap="round" />
            </g>

            <g transform="translate(305, 160)">
              <circle cx="0" cy="0" r="38" fill="#FFFFFF" />
              <circle cx="-24" cy="-22" r="13" fill="#FFFFFF" />
              <circle cx="0" cy="-32" r="14" fill="#FFFFFF" />
              <circle cx="24" cy="-22" r="13" fill="#FFFFFF" />
              <circle cx="-32" cy="4" r="13" fill="#FFFFFF" />
              <circle cx="32" cy="4" r="13" fill="#FFFFFF" />
              <ellipse cx="0" cy="0" rx="24" ry="22" fill="#F2E0A8" />
              <ellipse cx="-8" cy="-2" rx="4" ry="6" fill="#2D1C14" />
              <ellipse cx="8" cy="-2" rx="4" ry="6" fill="#2D1C14" />
              <path d="M -5 9 Q 0 14 5 9" stroke="#2D1C14" stroke-width="2.5" fill="none" stroke-linecap="round" />
            </g>

            <g transform="translate(512, 195)">
              <circle cx="0" cy="0" r="24" fill="#EFE0A8" />
              <ellipse cx="-6" cy="-4" rx="3" ry="4.5" fill="#2D1C14" />
              <ellipse cx="6" cy="-4" rx="3" ry="4.5" fill="#2D1C14" />
              <path d="M -4 4 Q 0 8 4 4" stroke="#2D1C14" stroke-width="2.2" fill="none" stroke-linecap="round" />
            </g>

            <g transform="translate(656, 105) rotate(180)">
              <circle cx="0" cy="0" r="24" fill="#EFE0A8" />
              <ellipse cx="-6" cy="-4" rx="3" ry="4.5" fill="#2D1C14" />
              <ellipse cx="6" cy="-4" rx="3" ry="4.5" fill="#2D1C14" />
              <path d="M -4 4 Q 0 8 4 4" stroke="#2D1C14" stroke-width="2.2" fill="none" stroke-linecap="round" />
            </g>
          </svg>
          <p class="preview-note">※ 年賀状のスキャン画像（<code>nengajo2027.jpg</code>）を同じフォルダに置くとここに表示されます</p>
        </div>
      `;
    }
  </script>
</body>
</html>
